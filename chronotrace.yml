version: 1

project:
  name: chronotrace
  data_dir: "~/.chronotrace/data"
  repositories_dir: "~/.chronotrace/repositories"

analysis:
  language: python
  granularity: file
  include_tests: true

  history:
    max_commits: null
    decay_half_life_days: 365

  filtering:
    exclude:
      - "**/.git/**"
      - "**/__pycache__/**"
      - "**/node_modules/**"
      - "**/.venv/**"
      - "**/venv/**"
      - "**/dist/**"
      - "**/build/**"
      - "**/coverage/**"
      - "**/*.lock"
      - "**/package-lock.json"

  bug_fix_labels:
    case_sensitive: false
    patterns:
      - "\\bfix\\b"
      - "\\bbug\\b"
      - "\\bhotfix\\b"
      - "\\bregression\\b"
      - "\\bpatch\\b"
      - "\\bresolve\\b"

graph:
  provider: neo4j
  uri: "bolt://localhost:7687"
  database: neo4j
  batch_size: 500

agent:
  provider: meta
  model: "muse-spark-1.3"
  reasoning_effort: medium
